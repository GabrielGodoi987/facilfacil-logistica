services:
  postgres:
    image: postgres:16-alpine
    container_name: easy-easy-logistic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: easy-easy-logistic
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
